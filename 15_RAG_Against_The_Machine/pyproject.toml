[project]
name = "15-rag-against-the-machine"
version = "0.1.0"
description = "RAG Against The Machine: a 42/1337 coding school common core project"
readme = "README.md"
authors = [
    { name = "r3dBust3r", email = "otmane.ki98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "fire>=0.7.1",
    "flake8>=7.5.0",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.1",
    "pydantic>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
15-rag-against-the-machine = "15_rag_against_the_machine:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
